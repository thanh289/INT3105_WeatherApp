<!-- public/index.html -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <h1>🌤️ Weather Dashboard</h1>

    <!-- Get All Weathers -->
    <section>
      <h2>📋 Get Today's Weathers</h2>
      <div class="form-group">
        <label>Limit:</label>
        <input type="number" id="limit" value="2" min="1" />
        <label>Page:</label>
        <input type="number" id="page" value="1" min="1" />
        <button id="btnGetWeathers">Get</button>
      </div>
      <pre id="allWeathers" class="result"></pre>
    </section>

    <!-- Get Weather by City -->
    <section>
      <h2>🏙️ Get Weather by City</h2>
      <div class="form-group">
        <label>City:</label>
        <input type="text" id="cityName" placeholder="e.g., London" />

        <label>Strategy:</label>
        <select id="strategy">
          <option value="reliable">🛡️ Reliable (Multiple providers + retry)</option>
          <option value="fast">⚡ Fast (Single provider, no retry)</option>
          <option value="cached">💾 Cached (DB first, then API)</option>
        </select>

        <button id="btnGetCity">Get Weather</button>
      </div>

      <div class="form-group">
        <label>
          <input type="checkbox" id="demoCB">
          🔧 Simulate API failure (test fallback)
        </label>
      </div>

      <div id="strategyInfo" class="info-box"></div>
      <pre id="cityWeather" class="result"></pre>
    </section>

    <!-- Get Average Temp -->
    <section>
      <h2>📊 Get Average Temperature</h2>
      <div class="form-group">
        <label>City:</label>
        <input type="text" id="avgCity" placeholder="e.g., Hanoi" />
        <label>Month:</label>
        <input type="number" id="avgMonth" min="1" max="12" placeholder="MM" />
        <label>Year:</label>
        <input type="number" id="avgYear" placeholder="YYYY" value="2025" />
        <button id="btnGetAvg">Get Average</button>
      </div>
      <pre id="avgTemp" class="result"></pre>
    </section>
  </div>

  <script src="script.js"></script>
</body>

</html>
